version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - LOGSTASH_URL=http://logstash:9600
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=utmstack
      - DB_USER=postgres
      - DB_PASS=admin
      - DB_PASSWORD=admin
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - GRPC_AGENT_MANAGER_HOST=agent-manager
      - GRPC_AGENT_MANAGER_PORT=50051
      - INTERNAL_KEY=utm-internal-key-2025
      - ENCRYPTION_KEY=utm-encryption-key-2025-secure
      - SERVER_NAME=utmstack-backend
      - SKIP_SNAPSHOT_REPO=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ping"]
      interval: 10s
      retries: 30
      start_period: 60s
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_started
  correlation:
    build: ./correlation
    ports:
      - "8085:8085"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=utmstack
      - DB_USER=postgres
      - DB_PASSWORD=admin
    volumes:
      - ./correlation/correlation-docker.yml:/app/config.yml:ro
    depends_on:
      - postgres
  agent-manager:
    build: ./agent-manager
    ports:
      - "9000:8080"
      - "50051:50051"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=utmstack
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - SERVER_ADDRESS=http://backend:8080
    volumes:
      - ./cert:/cert:ro
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
  log-auth-proxy:
    build: ./log-auth-proxy
    ports:
      - "8081:8080"
      - "50052:50051"
    environment:
      - UTM_HOST=http://backend:8080
      - UTM_AGENT_MANAGER_HOST=agent-manager:50051
      - INTERNAL_KEY=utm-internal-key-2025
    volumes:
      - ./cert:/cert:ro
    depends_on:
      backend:
        condition: service_healthy
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_DB=utmstack
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10
  elasticsearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9202:9200"
      - "9302:9300"
    volumes:
      - elasticsearch_data:/usr/share/opensearch/data
      - ./opensearch-backups:/usr/share/opensearch/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      retries: 20
      start_period: 60s
volumes:
  postgres_data:
  elasticsearch_data:
