# UTMStack Multi-Tenant Infrastructure Only
# PostgreSQL + Elasticsearch + Redis for development

version: '3.8'

networks:
  utmstack-network:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:

services:
  # PostgreSQL Database with Multi-Tenant Support
  postgres:
    image: postgres:15-alpine
    container_name: utmstack-postgres-mt
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utmstack_production}
      POSTGRES_USER: ${POSTGRES_USER:-utmstack_prod}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-local=trust --auth-host=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - utmstack-network
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-utmstack_prod} -d ${POSTGRES_DB:-utmstack_production}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Elasticsearch for Multi-Tenant Logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: utmstack-elasticsearch-mt
    restart: unless-stopped
    environment:
      - node.name=es-node-1
      - cluster.name=utmstack-production
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - utmstack-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for Caching and Sessions
  redis:
    image: redis:7.2-alpine
    container_name: utmstack-redis-mt
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    networks:
      - utmstack-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw incr ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Adminer for Database Management
  adminer:
    image: adminer:4.8.1-standalone
    container_name: utmstack-adminer-mt
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - utmstack-network
    depends_on:
      - postgres
