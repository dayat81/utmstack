logging:
    level:
        ROOT: debug
        tech.jhipster: DEBUG
        org.hibernate.SQL: DEBUG
        com.park.utmstack: debug
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE

spring:
    devtools:
        restart:
            enabled: true
            additional-exclude: static/**
        livereload:
            enabled: false # we use Webpack dev server + BrowserSync for livereload
    jackson:
        serialization:
            indent-output: true
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/utmstack_production}
        username: ${DATABASE_USERNAME:utmstack_prod}
        password: ${DATABASE_PASSWORD:UTMStack2025!Secure}
        hikari:
            poolName: Hikari
            auto-commit: false
    jpa:
        database-platform: tech.jhipster.domain.util.FixedPostgreSQL10Dialect
        database: POSTGRESQL # For Postgresql database
    elasticsearch: # This configuration is for the elasticsearch health indicator, please do not remove
        rest:
            uris: ${ELASTICSEARCH_HOSTS:http://localhost:9201}
    liquibase:
        contexts: dev
        change-log: classpath:config/liquibase/master.xml
    mail:
        host: localhost
        port: 25
        username: test@domain.local
        password: Admin123.
        protocol: smtp
    messages:
        cache-duration: PT1S # 1 second, see the ISO 8601 standard
    thymeleaf:
        cache: false

server:
    port: 8080

jhipster:
    # CORS is only enabled by default with the "dev" profile
    cors:
        # Allow Ionic for JHipster by default (* no longer allowed in Spring Boot 2.4+)
        allowed-origins: '*'
        allowed-methods: '*'
        allowed-headers: '*'
        exposed-headers: 'Authorization,Link,X-Total-Count,X-UtmStack-alert,X-UtmStack-error,X-UtmStack-params'
        allow-credentials: false
        max-age: 1800
    security:
        authentication:
            jwt:
                token-validity-in-seconds: 86400
                token-validity-in-seconds-for-remember-me: 2592000
    mail:
        from:
        base-url:

application:
    chart-builder: # Chart builder configuration
        ip-info-index-name: .utm-geoip
    incident-response:
        asset-verification-interval: 300

grpc:
    server:
        address: ${GRPC_AGENT_MANAGER_HOST}
        port: ${GRPC_AGENT_MANAGER_PORT}
