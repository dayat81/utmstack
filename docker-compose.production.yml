# UTMStack Multi-Tenant Production Docker Compose Configuration
# Phase 6 - Production Deployment
# Version: 1.0.0

version: '3.8'

networks:
  utmstack-production:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  utmstack-monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  postgres_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

services:
  # PostgreSQL Database with Multi-Tenant Support
  postgres:
    image: postgres:15-alpine
    container_name: utmstack-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: utmstack_production
      POSTGRES_USER: utmstack_prod
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-local=trust --auth-host=md5"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/production-deployment/postgres-init:/docker-entrypoint-initdb.d
      - /etc/utmstack/postgres:/etc/postgresql/conf.d
    ports:
      - "5432:5432"
    networks:
      - utmstack-production
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=500
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utmstack_prod -d utmstack_production"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Elasticsearch Cluster (Node 1)
  elasticsearch-1:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: utmstack-elasticsearch-1-prod
    restart: unless-stopped
    environment:
      - node.name=es-node-1
      - cluster.name=utmstack-production
      - discovery.seed_hosts=elasticsearch-2,elasticsearch-3
      - cluster.initial_master_nodes=es-node-1,es-node-2,es-node-3
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.client_authentication=required
      - xpack.security.transport.ssl.keystore.path=elastic-certificates.p12
      - xpack.security.transport.ssl.truststore.path=elastic-certificates.p12
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - /etc/utmstack/elasticsearch:/usr/share/elasticsearch/config/custom
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - utmstack-production
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTICSEARCH_PASSWORD} -s http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Elasticsearch Cluster (Node 2)
  elasticsearch-2:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: utmstack-elasticsearch-2-prod
    restart: unless-stopped
    environment:
      - node.name=es-node-2
      - cluster.name=utmstack-production
      - discovery.seed_hosts=elasticsearch-1,elasticsearch-3
      - cluster.initial_master_nodes=es-node-1,es-node-2,es-node-3
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.client_authentication=required
      - xpack.security.transport.ssl.keystore.path=elastic-certificates.p12
      - xpack.security.transport.ssl.truststore.path=elastic-certificates.p12
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /var/lib/elasticsearch-2:/usr/share/elasticsearch/data
      - /etc/utmstack/elasticsearch:/usr/share/elasticsearch/config/custom
    networks:
      - utmstack-production
    depends_on:
      - elasticsearch-1

  # Elasticsearch Cluster (Node 3)
  elasticsearch-3:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: utmstack-elasticsearch-3-prod
    restart: unless-stopped
    environment:
      - node.name=es-node-3
      - cluster.name=utmstack-production
      - discovery.seed_hosts=elasticsearch-1,elasticsearch-2
      - cluster.initial_master_nodes=es-node-1,es-node-2,es-node-3
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.client_authentication=required
      - xpack.security.transport.ssl.keystore.path=elastic-certificates.p12
      - xpack.security.transport.ssl.truststore.path=elastic-certificates.p12
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - /var/lib/elasticsearch-3:/usr/share/elasticsearch/data
      - /etc/utmstack/elasticsearch:/usr/share/elasticsearch/config/custom
    networks:
      - utmstack-production
    depends_on:
      - elasticsearch-1

  # UTMStack Backend (Multi-Tenant)
  utmstack-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    image: utmstack/backend:multi-tenant-production
    container_name: utmstack-backend-prod
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=production,multi-tenant
      - DATABASE_URL=jdbc:postgresql://postgres:5432/utmstack_production
      - DATABASE_USERNAME=utmstack_prod
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - ELASTICSEARCH_HOSTS=elasticsearch-1:9200,elasticsearch-2:9200,elasticsearch-3:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MULTI_TENANT_ENABLED=true
      - DATABASE_RLS_ENABLED=true
      - TENANT_CONTEXT_MANDATORY=true
      - AUDIT_LOGGING=comprehensive
      - JVM_OPTS=-Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    volumes:
      - /var/log/utmstack:/var/log/utmstack
      - /etc/utmstack/ssl:/etc/ssl/utmstack
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      - utmstack-production
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/management/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # UTMStack Backend (Replica for High Availability)
  utmstack-backend-replica:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    image: utmstack/backend:multi-tenant-production
    container_name: utmstack-backend-replica-prod
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=production,multi-tenant
      - DATABASE_URL=jdbc:postgresql://postgres:5432/utmstack_production
      - DATABASE_USERNAME=utmstack_prod
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - ELASTICSEARCH_HOSTS=elasticsearch-1:9200,elasticsearch-2:9200,elasticsearch-3:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - MULTI_TENANT_ENABLED=true
      - DATABASE_RLS_ENABLED=true
      - TENANT_CONTEXT_MANDATORY=true
      - AUDIT_LOGGING=comprehensive
      - JVM_OPTS=-Xms2g -Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - SERVER_PORT=8081
    volumes:
      - /var/log/utmstack:/var/log/utmstack
      - /etc/utmstack/ssl:/etc/ssl/utmstack
    ports:
      - "8081:8081"
    networks:
      - utmstack-production
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch-1:
        condition: service_healthy

  # UTMStack Frontend (Multi-Tenant)
  utmstack-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    image: utmstack/frontend:multi-tenant-production
    container_name: utmstack-frontend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://utmstack-backend:8080
      - TENANT_MODE=subdomain
      - SSL_ENABLED=true
    volumes:
      - /var/log/nginx:/var/log/nginx
    ports:
      - "4200:80"
      - "4443:443"
    networks:
      - utmstack-production
    depends_on:
      - utmstack-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Correlation Engine (Multi-Tenant)
  correlation:
    build:
      context: ./correlation
      dockerfile: Dockerfile
    image: utmstack/correlation:multi-tenant-production
    container_name: utmstack-correlation-prod
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - ELASTICSEARCH_HOSTS=elasticsearch-1:9200,elasticsearch-2:9200,elasticsearch-3:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - DATABASE_URL=postgres://utmstack_prod:${DATABASE_PASSWORD}@postgres:5432/utmstack_production?sslmode=require
      - MULTI_TENANT_ENABLED=true
      - TENANT_CONTEXT_HEADER=X-Tenant-ID
    volumes:
      - /var/log/utmstack:/var/log/utmstack
    networks:
      - utmstack-production
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch-1:
        condition: service_healthy

  # Agent Manager (Multi-Tenant)
  agent-manager:
    build:
      context: ./agent-manager
      dockerfile: Dockerfile
    image: utmstack/agent-manager:multi-tenant-production
    container_name: utmstack-agent-manager-prod
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - GRPC_PORT=9090
      - DATABASE_URL=postgres://utmstack_prod:${DATABASE_PASSWORD}@postgres:5432/utmstack_production?sslmode=require
      - ELASTICSEARCH_HOSTS=elasticsearch-1:9200,elasticsearch-2:9200,elasticsearch-3:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - MULTI_TENANT_ENABLED=true
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "9090:9090"
    volumes:
      - /var/log/utmstack:/var/log/utmstack
      - /etc/utmstack/ssl:/etc/ssl/utmstack
    networks:
      - utmstack-production
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx Load Balancer (Production)
  nginx:
    image: nginx:1.24-alpine
    container_name: utmstack-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8090:8090"  # Monitoring
    volumes:
      - /etc/nginx/sites-available/utmstack-multitenant:/etc/nginx/conf.d/default.conf
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
      - nginx_logs:/var/log/nginx
    networks:
      - utmstack-production
    depends_on:
      - utmstack-backend
      - utmstack-frontend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: utmstack-prometheus-prod
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - /etc/utmstack/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - /etc/utmstack/monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    networks:
      - utmstack-monitoring
      - utmstack-production
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:10.1.0
    container_name: utmstack-grafana-prod
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://monitoring.utmstack.com
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - /etc/utmstack/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/utmstack.json
    networks:
      - utmstack-monitoring
      - utmstack-production
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node Exporter (System Metrics)
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: utmstack-node-exporter-prod
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - utmstack-monitoring

  # PostgreSQL Exporter (Database Metrics)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.13.2
    container_name: utmstack-postgres-exporter-prod
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://utmstack_prod:${DATABASE_PASSWORD}@postgres:5432/utmstack_production?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - utmstack-production
      - utmstack-monitoring
    depends_on:
      postgres:
        condition: service_healthy

  # Elasticsearch Exporter (Search Metrics)
  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.6.0
    container_name: utmstack-elasticsearch-exporter-prod
    restart: unless-stopped
    command:
      - '--es.uri=http://elastic:${ELASTICSEARCH_PASSWORD}@elasticsearch-1:9200'
      - '--es.all'
      - '--es.indices'
      - '--es.cluster_settings'
      - '--es.shards'
    ports:
      - "9114:9114"
    networks:
      - utmstack-production
      - utmstack-monitoring
    depends_on:
      elasticsearch-1:
        condition: service_healthy

  # Redis (Caching and Session Storage)
  redis:
    image: redis:7.2-alpine
    container_name: utmstack-redis-prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - /var/lib/redis:/data
    networks:
      - utmstack-production
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw incr ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Watchtower (Automatic Updates)
  watchtower:
    image: containrrr/watchtower:1.6.0
    container_name: utmstack-watchtower-prod
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 2 * * *  # Update at 2 AM daily
      - WATCHTOWER_NOTIFICATIONS=email
      - WATCHTOWER_NOTIFICATION_EMAIL_FROM=${NOTIFICATION_EMAIL}
      - WATCHTOWER_NOTIFICATION_EMAIL_TO=${ADMIN_EMAIL}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER=${SMTP_SERVER}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT=587
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER=${SMTP_USER}
      - WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - utmstack-production
